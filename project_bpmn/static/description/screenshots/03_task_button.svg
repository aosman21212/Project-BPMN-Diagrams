  <text x="58" y="455" font-size="13" font-family="sans-serif" fill="#4361ee">🗺 Error Handling Process</text>
  <text x="58" y="472" font-size="11" font-family="sans-serif" fill="#6c757d">6 elements · 5 connections</text>

