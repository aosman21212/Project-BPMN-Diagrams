<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#555"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0L0 0 0 20" fill="none" stroke="#e4e7ec" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" fill="#f0f2f5"/>
  <rect width="1200" height="48" fill="#875a7b"/>
  <text x="20" y="30" fill="white" font-size="16" font-family="sans-serif" font-weight="bold">⬡ Odoo</text>
  <text x="90" y="30" fill="#ddd" font-size="13" font-family="sans-serif">Project  ›  BPMN Diagrams  ›  Payment Processing</text>

  <!-- Main card -->
  <rect x="16" y="60" width="1168" height="555" rx="6" fill="white" filter="url(#sh)"/>

  <!-- Toolbar -->
  <rect x="16" y="60" width="1168" height="38" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Tool buttons (simplified) -->
  <rect x="24" y="67" width="30" height="24" rx="4" fill="#4361ee"/>
  <text x="39" y="83" text-anchor="middle" font-size="11" fill="white">↖</text>
  <rect x="58" y="67" width="30" height="24" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="73" y="83" text-anchor="middle" font-size="11" fill="#555">→</text>
  <line x1="96" y1="70" x2="96" y2="88" stroke="#dee2e6"/>
  <!-- palette buttons abbreviated -->
  <rect x="104" y="67" width="30" height="24" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <circle cx="119" cy="79" r="7" fill="#52b788" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="138" y="67" width="30" height="24" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <rect x="143" y="72" width="20" height="14" rx="2" fill="white" stroke="#4361ee" stroke-width="1.5"/>
  <rect x="172" y="67" width="30" height="24" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="187" y="83" text-anchor="middle" font-size="13" fill="#f9a825">◇</text>
  <rect x="206" y="67" width="30" height="24" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <circle cx="221" cy="79" r="7" fill="#e63946" stroke="#9b1a23" stroke-width="3"/>

  <!-- ★ Export buttons HIGHLIGHTED -->
  <rect x="1010" y="65" width="76" height="28" rx="5" fill="#198754" stroke="#146c43" stroke-width="2" filter="url(#sh)"/>
  <text x="1048" y="83" text-anchor="middle" font-size="12" fill="white" font-family="sans-serif" font-weight="600">↓ BPMN</text>
  <!-- Glow ring around BPMN button -->
  <rect x="1007" y="62" width="82" height="34" rx="7" fill="none" stroke="#20c997" stroke-width="2.5" opacity="0.6"/>

  <rect x="1092" y="65" width="76" height="28" rx="5" fill="#198754" stroke="#146c43" stroke-width="2" filter="url(#sh)"/>
  <text x="1130" y="83" text-anchor="middle" font-size="12" fill="white" font-family="sans-serif" font-weight="600">↓ SVG</text>
  <!-- Glow ring around SVG button -->
  <rect x="1089" y="62" width="82" height="34" rx="7" fill="none" stroke="#20c997" stroke-width="2.5" opacity="0.6"/>

  <!-- Canvas area with a BPMN diagram -->
  <rect x="16" y="98" width="1168" height="480" fill="#f9fafb"/>
  <rect x="16" y="98" width="1168" height="480" fill="url(#grid)"/>

  <!-- A more complex BPMN: Payment Processing -->
  <!-- START -->
  <circle cx="90" cy="340" r="22" fill="#52b788" stroke="#2d6a4f" stroke-width="2" filter="url(#sh)"/>
  <text x="90" y="376" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">Start</text>

  <!-- seq: start → validate -->
  <line x1="112" y1="340" x2="175" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TASK: Validate Card -->
  <rect x="177" y="310" width="130" height="60" rx="6" fill="white" stroke="#4361ee" stroke-width="1.5" filter="url(#sh)"/>
  <text x="242" y="336" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#222">Validate</text>
  <text x="242" y="352" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#222">Card</text>

  <!-- seq: validate → gateway1 -->
  <line x1="307" y1="340" x2="365" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XOR GATEWAY: Valid? -->
  <polygon points="390,313 418,340 390,367 362,340" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/>
  <line x1="374" y1="324" x2="406" y2="356" stroke="#f9a825" stroke-width="2.5"/>
  <line x1="406" y1="324" x2="374" y2="356" stroke="#f9a825" stroke-width="2.5"/>
  <text x="390" y="383" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333">Valid?</text>

  <!-- seq: yes → charge -->
  <line x1="418" y1="340" x2="480" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="449" y="333" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">Yes</text>

  <!-- TASK: Charge Payment -->
  <rect x="482" y="310" width="130" height="60" rx="6" fill="white" stroke="#4361ee" stroke-width="1.5" filter="url(#sh)"/>
  <text x="547" y="336" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#222">Charge</text>
  <text x="547" y="352" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#222">Payment</text>

  <!-- seq: charge → gateway2 -->
  <line x1="612" y1="340" x2="672" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XOR GATEWAY: Success? -->
  <polygon points="697,313 725,340 697,367 669,340" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/>
  <line x1="681" y1="324" x2="713" y2="356" stroke="#f9a825" stroke-width="2.5"/>
  <line x1="713" y1="324" x2="681" y2="356" stroke="#f9a825" stroke-width="2.5"/>
  <text x="697" y="383" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333">Success?</text>

  <!-- seq: success → confirm -->
  <line x1="725" y1="340" x2="790" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="757" y="333" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">Yes</text>

  <!-- TASK: Confirm Order -->
  <rect x="792" y="310" width="130" height="60" rx="6" fill="white" stroke="#4361ee" stroke-width="1.5" filter="url(#sh)"/>
  <text x="857" y="336" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#222">Confirm</text>
  <text x="857" y="352" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#222">Order</text>

  <!-- seq: confirm → end success -->
  <line x1="922" y1="340" x2="988" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END (success) -->
  <circle cx="1010" cy="340" r="20" fill="#e63946" stroke="#9b1a23" stroke-width="4" filter="url(#sh)"/>
  <text x="1010" y="376" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">Done</text>

  <!-- No path from gateway1: card invalid -->
  <line x1="390" y1="367" x2="390" y2="450" stroke="#555" stroke-width="2"/>
  <line x1="390" y1="450" x2="242" y2="450" stroke="#555" stroke-width="2"/>
  <line x1="242" y1="450" x2="242" y2="371" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="443" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">No — Retry</text>

  <!-- No path from gateway2: charge failed -->
  <line x1="697" y1="367" x2="697" y2="480" stroke="#555" stroke-width="2"/>
  <line x1="697" y1="480" x2="547" y2="480" stroke="#555" stroke-width="2"/>
  <line x1="547" y1="480" x2="547" y2="371" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="473" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">Failed</text>

  <!-- Download tooltip for BPMN button -->
  <rect x="978" y="102" width="206" height="72" rx="5" fill="#212529" opacity="0.93" filter="url(#sh)"/>
  <polygon points="1048,96 1042,102 1054,102" fill="#212529"/>
  <text x="1081" y="124" text-anchor="middle" font-size="13" font-family="sans-serif" fill="white" font-weight="600">Export BPMN 2.0 XML</text>
  <text x="1081" y="142" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#adb5bd">Compatible with:</text>
  <text x="1081" y="158" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#20c997">Camunda · bpmn.io · Signavio</text>

  <!-- Download tooltip for SVG button -->
  <rect x="1060" y="102" width="120" height="54" rx="5" fill="#212529" opacity="0" />

  <!-- Status bar -->
  <rect x="16" y="578" width="1168" height="28" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="26" y="596" font-size="11" font-family="sans-serif" font-weight="600" fill="#495057">↖ Select/Move</text>
  <text x="180" y="596" font-size="11" font-family="sans-serif" fill="#6c757d">⬡ 9 elements · 8 connections</text>
  <text x="400" y="596" font-size="11" font-family="sans-serif" fill="#6c757d">🔍 100%</text>

  <!-- Caption -->
  <rect x="0" y="615" width="1200" height="25" fill="#343a40"/>
  <text x="600" y="631" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#adb5bd">
    Screenshot 4 — One-click Export to BPMN 2.0 XML (Camunda/Signavio compatible) or SVG
  </text>
</svg>
