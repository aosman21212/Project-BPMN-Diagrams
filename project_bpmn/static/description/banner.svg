<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3c"/>
      <stop offset="100%" style="stop-color:#2d3561"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#ffffff" opacity="0.07"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#dotgrid)"/>

  <!-- Left decorative BPMN flow (abstract) -->
  <!-- Start event -->
  <circle cx="100" cy="200" r="24" fill="none" stroke="#52b788" stroke-width="3" opacity="0.7"/>
  <circle cx="100" cy="200" r="18" fill="#52b788" opacity="0.5"/>
  <!-- Flow line -->
  <line x1="124" y1="200" x2="175" y2="200" stroke="#4361ee" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <!-- Task box -->
  <rect x="177" y="178" width="90" height="44" rx="6" fill="none" stroke="#4361ee" stroke-width="2" opacity="0.5"/>
  <line x1="267" y1="200" x2="315" y2="200" stroke="#4361ee" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <!-- Gateway diamond -->
  <polygon points="340,178 362,200 340,222 318,200" fill="none" stroke="#f9a825" stroke-width="2" opacity="0.5"/>
  <line x1="362" y1="200" x2="410" y2="200" stroke="#4361ee" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <!-- End event thick -->
  <circle cx="434" cy="200" r="22" fill="none" stroke="#e63946" stroke-width="5" opacity="0.5"/>

  <!-- Vertical line divider -->
  <line x1="540" y1="30" x2="540" y2="370" stroke="#4361ee" stroke-width="1" opacity="0.3"/>

  <!-- Main title -->
  <text x="580" y="140" font-size="46" font-family="'Segoe UI', sans-serif" font-weight="700" fill="white" filter="url(#glow)">
    Project BPMN Diagrams
  </text>
  <text x="580" y="185" font-size="20" font-family="'Segoe UI', sans-serif" fill="#a0aec0">
    Design · Visualise · Export process flows inside Odoo 19
  </text>

  <!-- Feature badges -->
  <!-- Badge 1 -->
  <rect x="580" y="220" width="160" height="38" rx="19" fill="#4361ee" opacity="0.85"/>
  <text x="660" y="244" text-anchor="middle" font-size="14" font-family="sans-serif" fill="white">🗺 BPMN 2.0 Editor</text>

  <!-- Badge 2 -->
  <rect x="754" y="220" width="160" height="38" rx="19" fill="#198754" opacity="0.85"/>
  <text x="834" y="244" text-anchor="middle" font-size="14" font-family="sans-serif" fill="white">📁 Export BPMN/SVG</text>

  <!-- Badge 3 -->
  <rect x="928" y="220" width="180" height="38" rx="19" fill="#875a7b" opacity="0.85"/>
  <text x="1018" y="244" text-anchor="middle" font-size="14" font-family="sans-serif" fill="white">🔗 Project &amp; Task Link</text>

  <!-- Badge 4 -->
  <rect x="580" y="272" width="178" height="38" rx="19" fill="#0dcaf0" opacity="0.75"/>
  <text x="669" y="296" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#212529">⚡ No Dependencies</text>

  <!-- Badge 5 -->
  <rect x="772" y="272" width="170" height="38" rx="19" fill="#f9a825" opacity="0.85"/>
  <text x="857" y="296" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#212529">✕ ⊕ Gateways</text>

  <!-- Odoo version pill -->
  <rect x="580" y="340" width="80" height="28" rx="14" fill="#4361ee" opacity="0.7"/>
  <text x="620" y="358" text-anchor="middle" font-size="13" font-family="sans-serif" fill="white">Odoo 19</text>

  <rect x="672" y="340" width="60" height="28" rx="14" fill="#198754" opacity="0.7"/>
  <text x="702" y="358" text-anchor="middle" font-size="13" font-family="sans-serif" fill="white">Free</text>
</svg>
